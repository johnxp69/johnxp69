<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060a"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>

    <filter id="glitchBlur">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,255,150,0.035)"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="300" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#bgGrad)"/>
    <rect width="900" height="300" fill="url(#scanlines)"/>

    <!-- flickering vignette pulse -->
    <rect width="900" height="300" fill="#00ff9c" opacity="0.02">
      <animate attributeName="opacity" values="0.02;0.06;0.01;0.05;0.02" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- circuit / wire lines background -->
    <g stroke="#00ffae" stroke-width="0.6" opacity="0.25">
      <path d="M0,40 H250 L280,70 H500" fill="none">
        <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <path d="M900,120 H650 L620,150 H400" fill="none">
        <animate attributeName="opacity" values="0.15;0.3;0.15" dur="4.2s" repeatCount="indefinite"/>
      </path>
      <path d="M0,260 H180 L210,230 H420 L450,260 H900" fill="none">
        <animate attributeName="opacity" values="0.2;0.4;0.1;0.2" dur="5s" repeatCount="indefinite"/>
      </path>
      <circle cx="280" cy="70" r="3" fill="#00ffae">
        <animate attributeName="r" values="2;4;2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="150" r="3" fill="#00ffae">
        <animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- abstract wireframe humanoid silhouette (original geometric form, not any copyrighted character) -->
    <g transform="translate(700,150)" opacity="0.85">
      <g stroke="#7dfcd0" stroke-width="1.1" fill="none" filter="url(#glitchBlur)">
        <!-- head -->
        <circle cx="0" cy="-70" r="22"/>
        <!-- neck/shoulders -->
        <path d="M-18,-50 L-30,-20 L-40,40 M18,-50 L30,-20 L40,40"/>
        <path d="M-30,-20 H30"/>
        <!-- torso lines -->
        <path d="M-25,-15 L-15,60 M25,-15 L15,60 M0,-48 V55"/>
        <!-- hair strands, angular -->
        <path d="M-22,-85 L-34,-60 M-14,-92 L-26,-64 M0,-94 L0,-68 M14,-92 L26,-64 M22,-85 L34,-60"/>
        <!-- data fragments floating off the silhouette -->
        <g opacity="0.6">
          <rect x="-70" y="-90" width="10" height="3">
            <animate attributeName="x" values="-70;-90;-70" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.9s" repeatCount="indefinite"/>
          </rect>
          <rect x="55" y="-30" width="14" height="3">
            <animate attributeName="x" values="55;80;55" dur="2.7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0.9;0.2" dur="2.2s" repeatCount="indefinite"/>
          </rect>
          <rect x="-60" y="40" width="8" height="3">
            <animate attributeName="x" values="-60;-85;-60" dur="4.1s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
      <!-- glitch duplicate offsets, RGB split style -->
      <g stroke="#ff2b6d" stroke-width="0.8" fill="none" opacity="0.35" transform="translate(2,0)">
        <circle cx="0" cy="-70" r="22"/>
        <path d="M-18,-50 L-30,-20 L-40,40 M18,-50 L30,-20 L40,40"/>
        <animateTransform attributeName="transform" type="translate" values="2,0;-3,1;2,0;4,-1;2,0" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <g stroke="#00c2ff" stroke-width="0.8" fill="none" opacity="0.35" transform="translate(-2,0)">
        <circle cx="0" cy="-70" r="22"/>
        <path d="M-18,-50 L-30,-20 L-40,40 M18,-50 L30,-20 L40,40"/>
        <animateTransform attributeName="transform" type="translate" values="-2,0;3,-1;-2,0;-4,1;-2,0" dur="1.1s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- terminal text block -->
    <g font-family="Consolas, 'Courier New', monospace" fill="#7dfcd0">
      <text x="40" y="90" font-size="13" opacity="0.7">root@wired:~$ whoami</text>
      <text x="40" y="120" font-size="30" font-weight="bold" fill="#00ffae">
        JOHN_ROBERT
        <animate attributeName="opacity" values="1;0.85;1;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </text>
      <!-- glitch layers of the name for RGB split flicker -->
      <text x="42" y="120" font-size="30" font-weight="bold" fill="#ff2b6d" opacity="0.25">
        JOHN_ROBERT
        <animate attributeName="x" values="42;38;44;40;42" dur="0.6s" repeatCount="indefinite"/>
      </text>
      <text x="38" y="120" font-size="30" font-weight="bold" fill="#00c2ff" opacity="0.25">
        JOHN_ROBERT
        <animate attributeName="x" values="38;43;36;41;38" dur="0.75s" repeatCount="indefinite"/>
      </text>

      <text x="40" y="150" font-size="14" opacity="0.85">
        &gt; role: information security / networking
      </text>
      <text x="40" y="172" font-size="14" opacity="0.85">
        &gt; os: garuda linux [kde plasma]
      </text>
      <text x="40" y="194" font-size="14" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="1.6s" repeatCount="indefinite"/>
        &gt; status: connected to the wired_
      </text>
    </g>

    <!-- random horizontal glitch bars -->
    <g fill="#00ffae">
      <rect x="0" y="0" width="900" height="4" opacity="0">
        <animate attributeName="y" values="0;40;120;200;260;0" dur="3.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0;0.4;0;0.6;0" dur="3.7s" repeatCount="indefinite"/>
        <animate attributeName="width" values="900;300;700;150;900" dur="3.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="900" height="2" opacity="0" fill="#ff2b6d">
        <animate attributeName="y" values="10;90;180;250;10" dur="2.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0;0.5;0" dur="2.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- flickering border frame -->
    <rect x="4" y="4" width="892" height="292" fill="none" stroke="#00ffae" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4;0.5;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
